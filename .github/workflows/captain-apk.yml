name: تطبيق الكابتن للمحلات (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shop-driver-app/**"
      - ".github/workflows/captain-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop-driver-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: تنزيل المكتبات
        run: npm install --no-audit --no-fund

      - name: تجهيز مشروع أندرويد
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      # نفس مفتاح التوقيع كل مرة، عشان التحديث ينزل فوق النسخة القديمة
      - name: مفتاح التوقيع
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: بناء الـAPK
        working-directory: shop-driver-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../mawj-captain.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mawj-captain-apk
          path: shop-driver-app/mawj-captain.apk

      # رابط ثابت للتنزيل: آخر نسخة دايمًا بنفس الرابط
      - name: نشر آخر نسخة
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete captain-latest --yes --cleanup-tag || true
          gh release create captain-latest mawj-captain.apk \
            --title "تطبيق الكابتن (محلات المي) — آخر نسخة" \
            --notes "نزّل الملف على تلفون الكابتن (أندرويد) وثبّته. إصدار ${{ github.run_number }}." \
            --target ${{ github.sha }}
